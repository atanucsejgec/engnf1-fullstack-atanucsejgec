# Render blueprint for the API. Secrets (DATABASE_URL, JWT_SECRET, CORS_ORIGIN)
# are set in the Render dashboard, never in this file.
services:
  - type: web
    name: triagesync-api
    runtime: node
    plan: free
    # same region as the Neon database, so each query is a short round trip
    region: singapore
    rootDir: backend
    # migrate + seed are both idempotent, so running them on every deploy is safe
    buildCommand: npm ci && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
